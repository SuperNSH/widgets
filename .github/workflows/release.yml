name: Release

# On a version tag (v0.1.0): builds the nsh-widgets command for macOS, Linux and Windows and attaches
# the binaries to the GitHub release. NSH installs the library itself from the tag.

on:
  push:
    tags: ["v*"]
  # Rebuilds the binaries for an existing tag (for example after a packaging fix) without moving it.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag, such as v0.1.0"
        required: true

permissions:
  contents: write

jobs:
  cli:
    name: cli (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - run: cargo build --release -p nsh-widgets-cli --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name=nsh-widgets-${{ matrix.target }}
          mkdir "$name"
          exe=target/${{ matrix.target }}/release/nsh-widgets
          [ -f "$exe.exe" ] && exe="$exe.exe"
          cp "$exe" README.md LICENSE "$name/"
          tar czf "$name.tar.gz" "$name"
          # Windows runners have sha256sum but no shasum.
          if command -v shasum > /dev/null; then shasum -a 256 "$name.tar.gz"; else sha256sum "$name.tar.gz"; fi > "$name.tar.gz.sha256"
      - uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2.3.2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            nsh-widgets-${{ matrix.target }}.tar.gz
            nsh-widgets-${{ matrix.target }}.tar.gz.sha256
