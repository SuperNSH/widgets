name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all -- --check

  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy
      # On macOS this also compiles the Swift bridge.
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --all-targets

  # What the Publish crates workflow uploads, packaged and built from the packages.
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - run: scripts/publish-crates.sh verify

  cross-check:
    name: check (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-ios }
          - { os: macos-latest, target: aarch64-apple-ios-sim }
          - { os: ubuntu-latest, target: aarch64-linux-android }
          - { os: ubuntu-latest, target: wasm32-unknown-unknown }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy
          targets: ${{ matrix.target }}
      - run: cargo clippy -p nsh-widgets --target ${{ matrix.target }} -- -D warnings

  android-library:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: "17"
      # Rebuilds the AAR from its sources (the Java must compile against the SDK) and checks the
      # committed one matches them.
      - run: scripts/check-aar.sh

  apple-extension:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      # Builds the gallery's widget extension for the simulator, devices and macOS, and its Android library.
      - run: cargo run -p nsh-widgets-cli -- build --app examples/gallery
      - run: cargo run -p nsh-widgets-cli -- check --app examples/gallery
      - run: test -d examples/gallery/.nsh-widgets/iphonesimulator/NshWidgets.appex/Metadata.appintents
      - run: test -d examples/gallery/.nsh-widgets/macosx/NshWidgets.appex/Contents/Resources/Metadata.appintents

  typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install NSH
        env:
          NSH_VERSION: v0.7.1
        run: |
          curl -fsSL https://nsh.dev/install.sh | sh
          echo "$HOME/.nsh/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Check, build and test
        working-directory: packages/nsh-widgets
        run: |
          nsh check
          nsh build 2>&1 | tee build.log
          ! grep -i warn build.log
          nsh test

  # The gallery imports the library by name: the repo root is an nshm with TSX exports, which
  # NSH 0.7.1 resolves through `nsh add`.
  gallery:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install NSH 0.7.1
        env:
          NSH_VERSION: v0.7.1
        run: |
          curl -fsSL https://nsh.dev/install.sh | sh
          echo "$HOME/.nsh/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Type-check the gallery
        working-directory: examples/gallery
        run: nsh check
      - name: Generate a Plasma 5 and a Plasma 6 widget
        run: |
          cargo run -q -p nsh-widgets-cli -- plasmoid Dashboard --group dev.supernsh.widgets.gallery --plasma 5 --out /tmp/p5
          cargo run -q -p nsh-widgets-cli -- plasmoid Dashboard --group dev.supernsh.widgets.gallery --plasma 6 --out /tmp/p6
          test -f /tmp/p5/contents/ui/NshNode.qml && test -f /tmp/p6/metadata.json
      - name: Generate a GNOME Shell extension
        run: |
          cargo run -q -p nsh-widgets-cli -- gnome Dashboard --group dev.supernsh.widgets.gallery --out /tmp/g
          test -f /tmp/g/metadata.json && test -f /tmp/g/config.json
          cp /tmp/g/extension.js /tmp/g/extension.mjs && node --check /tmp/g/extension.mjs
      - name: Generate a Cinnamon desklet and a desktop window
        run: |
          cargo run -q -p nsh-widgets-cli -- cinnamon Dashboard --group dev.supernsh.widgets.gallery --out /tmp/c
          cargo run -q -p nsh-widgets-cli -- window Dashboard --group dev.supernsh.widgets.gallery --out /tmp/w
          node --check /tmp/c/desklet.js && node --check /tmp/w/window.js
